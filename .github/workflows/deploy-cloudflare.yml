name: Deploy to Cloudflare Workers

# Manual only. Nothing deploys on push until you decide it should — change to
# `push: branches: [main]` once you are happy with the workflow.
#
# Why this exists: OpenNext is not fully supported on Windows (it says so itself),
# and `next build` fails there with EPERM when creating the symlinks for
# .next/standalone. GitHub runners are Linux, so the problem disappears — and
# deploys stop depending on one laptop.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — do not deploy"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        # A deploy that skips these is how a broken build reaches your agents.
        run: |
          pnpm typecheck
          pnpm test

      - name: Build for Workers
        env:
          # Build-time values. NEXT_PUBLIC_* are baked into the client bundle, so
          # they must be present here, not only at runtime.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        run: pnpm cf:build

      - name: Report bundle size
        # The Workers limit is 10 MB COMPRESSED. Note this deliberately does not
        # measure .open-next/worker.js - that is a ~2 KB entry point, not the
        # bundle. Only wrangler knows the real upload size, and --dry-run reports
        # it without needing credentials or deploying anything.
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir=/tmp/wrangler-out 2>&1 | tee /tmp/dryrun.txt
          SIZE_LINE=$(grep -i "Total Upload" /tmp/dryrun.txt || true)
          echo "$SIZE_LINE"
          GZ_KIB=$(echo "$SIZE_LINE" | sed -n 's/.*gzip: *\([0-9.]*\) KiB.*/\1/p')
          if [ -z "$GZ_KIB" ]; then
            echo "::warning::Could not read the bundle size from wrangler output."
            exit 0
          fi
          echo "Compressed bundle: ${GZ_KIB} KiB of the 10240 KiB limit"
          OVER=$(awk -v g="$GZ_KIB" 'BEGIN{print (g > 10240) ? 1 : 0}')
          WARN=$(awk -v g="$GZ_KIB" 'BEGIN{print (g > 8192) ? 1 : 0}')
          if [ "$OVER" = "1" ]; then
            echo "::error::Bundle exceeds the 10 MB compressed Workers limit."
            exit 1
          elif [ "$WARN" = "1" ]; then
            echo "::warning::Bundle is over 8 MB compressed - approaching the 10 MB limit."
          fi

      - name: Deploy
        if: ${{ inputs.dry_run == false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Reminder
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run complete - nothing was deployed."
          echo "Re-run with dry_run unchecked to deploy."
          echo
          echo "Runtime secrets are set on the Worker itself, not here:"
          echo "  npx wrangler secret put DATABASE_URL"
          echo "  npx wrangler secret put CLERK_SECRET_KEY"
          echo "  npx wrangler secret put PUBLIC_LEAD_API_KEYS"
          echo "  ...and the WEBHOOK_SECRET_* and S3_* values when you need them."
