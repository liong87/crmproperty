name: PDPA retention purge

# Two retention jobs, one schedule.
#
# 1. Hard-deletes UNCONVERTED leads older than 24 months, plus their activities,
#    documents (and the stored files), and message logs. Converted leads are kept —
#    they belong to a live client relationship.
# 2. Hard-deletes notifications older than 90 days. Their bodies carry client names,
#    so they were personal data sitting outside the retention policy entirely — a
#    client's name could outlive the lead it came from.
#
# This exists because scripts/purge-stale-leads.ts was written but never scheduled,
# which meant the 24-month retention obligation was documented and not actually
# being carried out.
#
# 1st of each month, 19:30 UTC = 03:30 Malaysia time.
on:
  schedule:
    - cron: "30 19 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the purge
        env:
          # Direct connection (5432). The purge issues DELETEs across several tables;
          # run it outside the transaction pooler.
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          # Needed so the script can delete the stored files belonging to purged leads.
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          PURGE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: pnpm purge:leads

      - name: Purge old notifications
        # Separate step, and deliberately AFTER the lead purge: notification bodies
        # carry client names (server/notifications/jobs.ts builds them from contact and
        # project names), so they are personal data on a 90-day clock of their own.
        # `if: always()` so a failure in the lead purge does not silently skip this one.
        if: always()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          PURGE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: pnpm purge:notifications

      - name: Note the outcome
        if: always()
        run: echo "Purge finished with status ${{ job.status }}. Check the log above for counts."
