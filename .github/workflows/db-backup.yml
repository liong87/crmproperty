name: Database backup

# Daily at 18:00 UTC = 02:00 Malaysia time (quiet hours for the agency).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        # pg_dump must be the same major version as the server or newer. Supabase is
        # on 17.x, so 16 aborts with "server version mismatch".
        #
        # Installing postgresql-client-17 is not enough on its own: GitHub's Ubuntu
        # runners ship PostgreSQL 16, and /usr/bin/pg_dump keeps pointing at it. The
        # 17 binaries land in /usr/lib/postgresql/17/bin, so that directory has to go
        # to the FRONT of PATH — hence the $GITHUB_PATH line, which applies to every
        # later step in the job.
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify the client version
        # Fail here, loudly, rather than three steps later inside pg_dump.
        run: |
          set -euo pipefail
          pg_dump --version
          MAJOR=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::pg_dump is version $MAJOR; 17 or newer is required for this server."
            exit 1
          fi

      - name: Dump the database
        env:
          # IMPORTANT: this must be the DIRECT connection (port 5432),
          # not the pooler on 6543 - pg_dump cannot run through transaction pooling.
          PGCONN: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          pg_dump "$PGCONN" \
            --format=custom \
            --schema=public \
            --no-owner --no-privileges \
            --file="crm-$STAMP.dump"
          ls -lh "crm-$STAMP.dump"

      - name: Fail if the dump looks wrong
        # A 'successful' but empty dump is the classic silent backup failure.
        #
        # This used to be a raw size floor of 50 KB, which assumed a populated CRM and
        # failed the day it was first run against a nearly empty database — a 35 KB
        # dump of a real, correct, mostly-empty schema. Size is a poor proxy: it is
        # wrong early on, and later it would pass even if half the tables vanished.
        #
        # Instead, inspect the dump's table of contents and insist the tables that
        # matter are actually in there. That catches the failure this guard is for —
        # a dump that ran but captured nothing — at any database size.
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "crm-${STAMP}.dump")
          echo "Dump size: $SIZE bytes"

          # A valid custom-format dump has a header and a TOC; anything this small is
          # truncated or empty regardless of how little data exists.
          if [ "$SIZE" -lt 4096 ]; then
            echo "::error::Dump is only $SIZE bytes - truncated or empty."
            exit 1
          fi

          # Readable by pg_restore at all?
          if ! pg_restore --list "crm-${STAMP}.dump" > /tmp/toc.txt 2>/tmp/toc.err; then
            echo "::error::pg_restore cannot read the dump - it is corrupt."
            cat /tmp/toc.err
            exit 1
          fi

          # Every table the application cannot function without.
          MISSING=""
          for t in users leads contacts properties deals activities documents; do
            grep -qE "TABLE (DATA )?public $t( |$)" /tmp/toc.txt || MISSING="$MISSING $t"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Dump is missing expected tables:$MISSING"
            exit 1
          fi

          echo "Dump contains all expected tables."

      - name: Encrypt
        # Client data includes NRIC and passport numbers - it must not sit unencrypted in a bucket.
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$PASSPHRASE" > /tmp/pp
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-file /tmp/pp \
              -o "crm-${STAMP}.dump.gpg" "crm-${STAMP}.dump"
          shred -u /tmp/pp "crm-${STAMP}.dump"
          ls -lh "crm-${STAMP}.dump.gpg"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "crm-${STAMP}.dump.gpg" \
            "s3://${R2_BUCKET}/db/crm-${STAMP}.dump.gpg" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Uploaded db/crm-${STAMP}.dump.gpg"

      - name: List what is now stored
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          aws s3 ls "s3://${R2_BUCKET}/db/" --endpoint-url "$R2_ENDPOINT" | tail -40
